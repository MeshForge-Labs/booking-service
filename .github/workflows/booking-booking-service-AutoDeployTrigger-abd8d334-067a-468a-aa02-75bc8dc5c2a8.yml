name: Trigger auto deployment for booking-booking-service

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/booking-booking-service-AutoDeployTrigger-abd8d334-067a-468a-aa02-75bc8dc5c2a8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BOOKINGBOOKINGSERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BOOKINGBOOKINGSERVICE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BOOKINGBOOKINGSERVICE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.BOOKINGBOOKINGSERVICE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BOOKINGBOOKINGSERVICE_REGISTRY_PASSWORD }}
          containerAppName: booking-booking-service
          resourceGroup: booking-rg
          imageToBuild: sandithi16/booking-booking-service:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


